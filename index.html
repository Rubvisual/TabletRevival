<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               minimum-scale=1.0,
               user-scalable=no">

<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#050608">

<title>Rubi Dashboard</title>

<style>

/* =========================================================
   RESET
   ========================================================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;

    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none;
    user-select: none;
}

html,
body {

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: #050608;

    color: #ffffff;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        Arial,
        sans-serif;

    -webkit-font-smoothing: antialiased;
}


/* =========================================================
   FONDO
   ========================================================= */

body {

    background:

        radial-gradient(
            ellipse at 15% 15%,
            rgba(65,85,125,0.55),
            transparent 45%
        ),

        radial-gradient(
            ellipse at 90% 90%,
            rgba(70,35,100,0.45),
            transparent 45%
        ),

        linear-gradient(
            135deg,
            #050608 0%,
            #10141e 50%,
            #06070b 100%
        );

    position: relative;
}


/* brillo ambiental */

body:before {

    content: "";

    position: absolute;

    width: 55vw;
    height: 55vw;

    left: -20vw;
    top: -35vw;

    background:
        radial-gradient(
            circle,
            rgba(255,255,255,0.05),
            transparent 65%
        );

    pointer-events: none;
}


/* =========================================================
   CONTENEDOR PRINCIPAL
   ========================================================= */

.dashboard {

    width: 100%;
    height: 100%;

    padding: 26px 32px;

    position: relative;

    display: flex;
    flex-direction: column;

    z-index: 1;
}


/* =========================================================
   BARRA SUPERIOR
   ========================================================= */

.topbar {

    height: 38px;

    display: flex;

    align-items: center;

    justify-content: space-between;
}


.status {

    display: flex;

    align-items: center;

    gap: 8px;

    color: rgba(255,255,255,0.55);

    font-size: 13px;

    font-weight: 500;

    letter-spacing: 0.2px;
}


.status-dot {

    width: 8px;
    height: 8px;

    border-radius: 50%;

    background: #30d158;

    box-shadow:
        0 0 10px rgba(48,209,88,0.65);
}


.status-dot.offline {

    background: #ff9f0a;

    box-shadow:
        0 0 10px rgba(255,159,10,0.5);
}


.city {

    color: rgba(255,255,255,0.55);

    font-size: 13px;

    font-weight: 500;
}


/* =========================================================
   CONTENIDO PRINCIPAL
   ========================================================= */

.content {

    flex: 1;

    display: flex;

    align-items: center;

    justify-content: space-between;

    gap: 30px;

    min-height: 0;
}


/* =========================================================
   ZONA IZQUIERDA
   ========================================================= */

.left {

    flex: 1;

    min-width: 0;

    display: flex;

    flex-direction: column;

    justify-content: center;

    padding-left: 20px;
}


/* =========================================================
   HORA
   ========================================================= */

.time {

    font-size: clamp(
        90px,
        14vw,
        145px
    );

    line-height: 0.85;

    font-weight: 600;

    letter-spacing: -7px;

    color: #ffffff;

    text-shadow:
        0 8px 35px rgba(0,0,0,0.45);
}


.date {

    margin-top: 24px;

    font-size: clamp(
        20px,
        2.8vw,
        29px
    );

    font-weight: 500;

    color: #ff453a;

    text-transform: capitalize;

    letter-spacing: -0.4px;
}


/* =========================================================
   CLIMA
   ========================================================= */

.weather {

    margin-top: 32px;

    width: 330px;

    min-height: 92px;

    padding: 18px 22px;

    display: flex;

    align-items: center;

    gap: 18px;

    border-radius: 25px;

    background:
        rgba(255,255,255,0.075);

    border:
        1px solid rgba(255,255,255,0.12);

    box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.10),
        0 12px 35px rgba(0,0,0,0.25);

    -webkit-backdrop-filter:
        blur(20px);

    backdrop-filter:
        blur(20px);
}


.weather-icon {

    font-size: 40px;

    width: 48px;

    text-align: center;
}


.weather-info {

    display: flex;

    flex-direction: column;

    justify-content: center;
}


.temperature {

    font-size: 32px;

    font-weight: 600;

    line-height: 1;

    letter-spacing: -1px;
}


.weather-status {

    margin-top: 7px;

    font-size: 14px;

    color:
        rgba(255,255,255,0.65);
}


.weather-updated {

    margin-top: 4px;

    font-size: 11px;

    color:
        rgba(255,255,255,0.35);
}


/* =========================================================
   CALENDARIO
   ========================================================= */

.calendar {

    width: 350px;

    padding: 24px;

    border-radius: 28px;

    background:
        rgba(255,255,255,0.075);

    border:
        1px solid rgba(255,255,255,0.12);

    box-shadow:

        inset
        0 1px 0
        rgba(255,255,255,0.12),

        0 15px 45px
        rgba(0,0,0,0.30);

    -webkit-backdrop-filter:
        blur(20px);

    backdrop-filter:
        blur(20px);
}


.calendar-header {

    display: flex;

    align-items: center;

    justify-content: space-between;

    margin-bottom: 18px;
}


.calendar-title {

    font-size: 19px;

    font-weight: 600;

    text-transform: capitalize;

    letter-spacing: -0.3px;
}


.calendar-year {

    color:
        rgba(255,255,255,0.40);

    font-size: 13px;
}


/* fila días semana */

.week {

    display: flex;

    width: 100%;

    margin-bottom: 7px;
}


.week div {

    flex: 1;

    text-align: center;

    font-size: 10px;

    font-weight: 600;

    color:
        rgba(255,255,255,0.35);
}


/* grilla */

.days {

    display: flex;

    flex-wrap: wrap;

    width: 100%;
}


.day {

    width: 14.285%;

    height: 35px;

    display: flex;

    align-items: center;

    justify-content: center;

    font-size: 13px;

    color:
        rgba(255,255,255,0.78);
}


.day.empty {

    opacity: 0;
}


.day.today span {

    width: 29px;
    height: 29px;

    display: flex;

    align-items: center;

    justify-content: center;

    border-radius: 50%;

    background: #ff453a;

    color: #ffffff;

    font-weight: 600;

    box-shadow:
        0 4px 12px
        rgba(255,69,58,0.40);
}


/* =========================================================
   FOOTER
   ========================================================= */

.footer {

    height: 42px;

    display: flex;

    align-items: center;

    justify-content: space-between;
}


.quote {

    font-size: 12px;

    color:
        rgba(255,255,255,0.32);

    font-weight: 400;
}


.footer-right {

    display: flex;

    align-items: center;

    gap: 10px;
}


/* =========================================================
   BOTONES
   ========================================================= */

.icon-button {

    width: 34px;
    height: 34px;

    border-radius: 50%;

    border:
        1px solid
        rgba(255,255,255,0.10);

    background:
        rgba(255,255,255,0.06);

    color:
        rgba(255,255,255,0.65);

    font-size: 15px;

    display: flex;

    align-items: center;

    justify-content: center;

    cursor: pointer;
}


/* =========================================================
   MODAL AJUSTES
   ========================================================= */

.modal {

    position: fixed;

    left: 0;
    top: 0;

    width: 100%;
    height: 100%;

    display: none;

    align-items: center;

    justify-content: center;

    background:
        rgba(0,0,0,0.65);

    z-index: 50;
}


.modal.active {

    display: flex;
}


.modal-box {

    width: 380px;

    max-width: 85%;

    padding: 26px;

    border-radius: 28px;

    background:
        #1c1c1e;

    border:
        1px solid
        rgba(255,255,255,0.12);

    box-shadow:
        0 25px 70px
        rgba(0,0,0,0.65);
}


.modal-title {

    font-size: 20px;

    font-weight: 600;

    margin-bottom: 22px;
}


.form-group {

    margin-bottom: 16px;
}


.form-group label {

    display: block;

    margin-bottom: 7px;

    font-size: 12px;

    color:
        rgba(255,255,255,0.50);
}


.input {

    width: 100%;

    padding: 12px;

    border-radius: 12px;

    border:
        1px solid
        rgba(255,255,255,0.10);

    background:
        #2c2c2e;

    color: white;

    font-size: 14px;

    outline: none;
}


.save-button {

    width: 100%;

    margin-top: 8px;

    padding: 13px;

    border: none;

    border-radius: 13px;

    background: #0a84ff;

    color: white;

    font-size: 15px;

    font-weight: 600;
}


/* =========================================================
   RESPONSIVE
   ========================================================= */


/* Tablet horizontal 1024x600 */

@media (max-width: 1100px) {

    .dashboard {

        padding: 20px 25px;
    }

    .content {

        gap: 20px;
    }

    .calendar {

        width: 315px;

        padding: 20px;
    }

    .weather {

        width: 310px;
    }

    .left {

        padding-left: 10px;
    }
}


/* =========================================================
   1024 x 600 ESPECÍFICO
   ========================================================= */

@media (max-height: 650px) {

    .dashboard {

        padding:
            18px 24px;
    }

    .topbar {

        height: 28px;
    }

    .time {

        font-size: 108px;

        letter-spacing: -6px;
    }

    .date {

        margin-top: 15px;

        font-size: 20px;
    }

    .weather {

        margin-top: 20px;

        min-height: 78px;

        padding: 14px 18px;
    }

    .weather-icon {

        font-size: 32px;
    }

    .temperature {

        font-size: 28px;
    }

    .calendar {

        width: 300px;

        padding: 18px;
    }

    .calendar-header {

        margin-bottom: 12px;
    }

    .day {

        height: 30px;

        font-size: 12px;
    }

    .day.today span {

        width: 25px;
        height: 25px;
    }

    .footer {

        height: 32px;
    }
}


/* =========================================================
   PANTALLAS MUY PEQUEÑAS
   ========================================================= */

@media (max-width: 750px) {

    .dashboard {

        padding: 15px;
    }

    .content {

        gap: 12px;
    }

    .calendar {

        width: 275px;
    }

    .weather {

        width: 290px;
    }

    .quote {

        display: none;
    }
}


/* =========================================================
   MODO MUY AHORRADOR
   ========================================================= */

.low-power * {

    animation: none !important;

    transition: none !important;
}

</style>
</head>


<body>

    class="modal"

        </div>

                class="input"

        </div>

            <label>
                Longitud
            </label>

            <input
                class="input"

                value="-58.3816">

        </div>

            id="saveButton">

            Guardar

        </button>

</div>


<script>

/* =========================================================
   VARIABLES
   ========================================================= */

var clock =
    document.getElementById("clock");

var date =
    document.getElementById("date");

var temperature =
    document.getElementById("temperature");

var weatherStatus =
    document.getElementById("weatherStatus");

var weatherUpdated =
    document.getElementById("weatherUpdated");

var weatherIcon =
    document.getElementById("weatherIcon");

var statusDot =
    document.getElementById("statusDot");

var statusText =
    document.getElementById("statusText");

var city =
    document.getElementById("city");

var calendarMonth =
    document.getElementById("calendarMonth");

var calendarYear =
    document.getElementById("calendarYear");

var calendarDays =
    document.getElementById("calendarDays");

var quote =
    document.getElementById("quote");

var settingsModal =
    document.getElementById("settingsModal");

var cityInput =
    document.getElementById("cityInput");

var latInput =
    document.getElementById("latInput");

var lonInput =
    document.getElementById("lonInput");


/* =========================================================
   CONFIGURACIÓN
   ========================================================= */

var WEATHER_INTERVAL =
    15 * 60 * 1000;


/* =========================================================
   FRASES
   ========================================================= */

var quotes = [

    "Tu espacio. Tu momento.",

    "La simplicidad es la máxima sofisticación.",

    "Diseñar es hacer visible una idea.",

    "Menos ruido. Más intención.",

    "Crea el futuro que querés ver.",

    "Modo Dashboard activo."

];


function cambiarFrase() {

    var index =
        Math.floor(
            Math.random() *
            quotes.length
        );

    quote.textContent =
        quotes[index];
}


setInterval(
    cambiarFrase,
    30000
);


/* =========================================================
   RELOJ
   ========================================================= */

function actualizarReloj() {

    var ahora =
        new Date();

    var horas =
        ahora.getHours();

    var minutos =
        ahora.getMinutes();

    if (horas < 10) {
        horas = "0" + horas;
    }

    if (minutos < 10) {
        minutos = "0" + minutos;
    }

    clock.textContent =
        horas + ":" + minutos;


    var opciones = {

        weekday: "long",

        day: "numeric",

        month: "long"

    };


    date.textContent =
        ahora.toLocaleDateString(
            "es-AR",
            opciones
        );
}


actualizarReloj();


setInterval(
    actualizarReloj,
    1000
);


/* =========================================================
   CALENDARIO
   ========================================================= */

function generarCalendario() {

    var ahora =
        new Date();

    var año =
        ahora.getFullYear();

    var mes =
        ahora.getMonth();

    var diaActual =
        ahora.getDate();


    var nombresMeses = [

        "enero",
        "febrero",
        "marzo",
        "abril",
        "mayo",
        "junio",
        "julio",
        "agosto",
        "septiembre",
        "octubre",
        "noviembre",
        "diciembre"

    ];


    calendarMonth.textContent =
        nombresMeses[mes];

    calendarYear.textContent =
        año;


    calendarDays.innerHTML =
        "";


    var primerDia =
        new Date(
            año,
            mes,
            1
        ).getDay();


    var diasMes =
        new Date(
            año,
            mes + 1,
            0
        ).getDate();


    var i;


    /* espacios */

    for (
        i = 0;
        i < primerDia;
        i++
    ) {

        var empty =
            document.createElement("div");

        empty.className =
            "day empty";

        calendarDays.appendChild(
            empty
        );
    }


    /* días */

    for (
        i = 1;
        i <= diasMes;
        i++
    ) {

        var elemento =
            document.createElement("div");

        elemento.className =
            "day";


        var numero =
            document.createElement("span");

        numero.textContent =
            i;


        if (i === diaActual) {

            elemento.className =
                "day today";

        }


        elemento.appendChild(
            numero
        );


        calendarDays.appendChild(
            elemento
        );

    }

}


generarCalendario();


/* =========================================================
   CLIMA
   ========================================================= */

function obtenerConfiguracion() {

    return {

        city:
            localStorage.getItem(
                "dashboard_city"
            ) || "Buenos Aires",

        lat:
            localStorage.getItem(
                "dashboard_lat"
            ) || "-34.6037",

        lon:
            localStorage.getItem(
                "dashboard_lon"
            ) || "-58.3816"

    };

}


/* =========================================================
   ICONOS DEL CLIMA
   ========================================================= */

function obtenerIconoClima(
    codigo
) {

    if (codigo === 0) {

        return "☀";

    }

    if (
        codigo === 1 ||
        codigo === 2
    ) {

        return "🌤";

    }

    if (codigo === 3) {

        return "☁";

    }

    if (
        codigo === 45 ||
        codigo === 48
    ) {

        return "🌫";

    }

    if (
        codigo >= 51 &&
        codigo <= 67
    ) {

        return "🌧";

    }

    if (
        codigo >= 71 &&
        codigo <= 77
    ) {

        return "❄";

    }

    if (
        codigo >= 80 &&
        codigo <= 82
    ) {

        return "🌧";

    }

    if (codigo >= 95) {

        return "⛈";

    }

    return "☁";

}


/* =========================================================
   TEXTO DEL CLIMA
   ========================================================= */

function traducirClima(
    codigo
) {

    if (codigo === 0)
        return "Despejado";

    if (codigo === 1)
        return "Mayormente despejado";

    if (codigo === 2)
        return "Parcialmente nublado";

    if (codigo === 3)
        return "Nublado";

    if (
        codigo === 45 ||
        codigo === 48
    )
        return "Niebla";

    if (
        codigo >= 51 &&
        codigo <= 55
    )
        return "Llovizna";

    if (
        codigo >= 56 &&
        codigo <= 57
    )
        return "Llovizna helada";

    if (
        codigo >= 61 &&
        codigo <= 67
    )
        return "Lluvia";

    if (
        codigo >= 71 &&
        codigo <= 77
    )
        return "Nieve";

    if (
        codigo >= 80 &&
        codigo <= 82
    )
        return "Chaparrones";

    if (codigo >= 95)
        return "Tormenta";

    return "Nublado";

}


/* =========================================================
   GUARDAR CLIMA
   ========================================================= */

function guardarClima(
    temperaturaValor,
    codigo
) {

    var datos = {

        temperature:
            temperaturaValor,

        code:
            codigo,

        timestamp:
            new Date().getTime()

    };


    try {

        localStorage.setItem(
            "dashboard_weather",
            JSON.stringify(datos)
        );

    } catch (e) {

        /* Si falla localStorage,
           no hacemos nada */

    }

}


/* =========================================================
   MOSTRAR CLIMA
   ========================================================= */

function mostrarClima(
    temperaturaValor,
    codigo,
    textoActualizacion
) {

    temperature.textContent =
        Math.round(
            temperaturaValor
        ) + "°";


    weatherStatus.textContent =
        traducirClima(
            codigo
        );


    weatherIcon.textContent =
        obtenerIconoClima(
            codigo
        );


    weatherUpdated.textContent =
        textoActualizacion;

}


/* =========================================================
   CLIMA GUARDADO
   ========================================================= */

function cargarClimaGuardado() {

    try {

        var guardado =
            localStorage.getItem(
                "dashboard_weather"
            );


        if (!guardado) {

            return false;

        }


        var datos =
            JSON.parse(
                guardado
            );


        if (
            datos &&
            typeof datos.temperature !== "undefined"
        ) {

            mostrarClima(

                datos.temperature,

                datos.code,

                "Último dato disponible"

            );


            return true;

        }

    } catch (e) {

        return false;

    }


    return false;

}


/* =========================================================
   OBTENER CLIMA ONLINE
   ========================================================= */

function obtenerClima() {

    var config =
        obtenerConfiguracion();


    var url =
        "https://api.open-meteo.com/v1/forecast" +

        "?latitude=" +
        encodeURIComponent(
            config.lat
        ) +

        "&longitude=" +
        encodeURIComponent(
            config.lon
        ) +

        "&current=temperature_2m,weather_code" +

        "&temperature_unit=celsius" +

        "&timezone=auto";


    statusText.textContent =
        "Actualizando clima...";


    var xhr =
        new XMLHttpRequest();


    xhr.open(
        "GET",
        url,
        true
    );


    xhr.timeout =
        10000;


    xhr.onreadystatechange =
        function() {

            if (
                xhr.readyState !== 4
            ) {

                return;

            }


            if (
                xhr.status >= 200 &&
                xhr.status < 300
            ) {

                try {

                    var respuesta =
                        JSON.parse(
                            xhr.responseText
                        );


                    if (
                        respuesta &&
                        respuesta.current
                    ) {

                        var temp =
                            respuesta.current.temperature_2m;

                        var codigo =
                            respuesta.current.weather_code;


                        guardarClima(
                            temp,
                            codigo
                        );


                        mostrarClima(

                            temp,

                            codigo,

                            "Actualizado ahora"

                        );


                        statusDot.className =
                            "status-dot";


                        statusText.textContent =
                            "Conectado";

                    }

                }

                catch (error) {

                    manejarErrorClima();

                }

            }

            else {

                manejarErrorClima();

            }

        };


    xhr.onerror =
        function() {

            manejarErrorClima();

        };


    xhr.ontimeout =
        function() {

            manejarErrorClima();

        };


    try {

        xhr.send();

    }

    catch (error) {

        manejarErrorClima();

    }

}


/* =========================================================
   ERROR / SIN INTERNET
   ========================================================= */

function manejarErrorClima() {

    var tieneCache =
        cargarClimaGuardado();


    statusDot.className =
        "status-dot offline";


    if (tieneCache) {

        statusText.textContent =
            "Sin conexión · usando último dato";

        weatherUpdated.textContent =
            "Sin Internet · último dato guardado";

    }

    else {

        statusText.textContent =
            "Sin conexión";

        weatherStatus.textContent =
            "Sin datos";

        weatherUpdated.textContent =
            "Esperando conexión";

    }

}


/* =========================================================
   ARRANQUE CLIMA
   ========================================================= */

/*
   Primero mostramos inmediatamente
   el último clima guardado.

   Después intentamos obtener uno nuevo.
*/

cargarClimaGuardado();

obtenerClima();


/* =========================================================
   REFRESCO CADA 15 MINUTOS
   ========================================================= */

setInterval(

    obtenerClima,

    WEATHER_INTERVAL

);


/* =========================================================
   DETECTAR INTERNET
   ========================================================= */

window.addEventListener(
    "online",
    function() {

        statusDot.className =
            "status-dot";

        statusText.textContent =
            "Conexión recuperada";

        obtenerClima();

    }
);


window.addEventListener(
    "offline",
    function() {

        statusDot.className =
            "status-dot offline";

        statusText.textContent =
            "Sin conexión";

        cargarClimaGuardado();

    }
);


/* =========================================================
   BOTÓN REFRESH
   ========================================================= */

document.getElementById(
    "refreshButton"
).onclick = function() {

    generarCalendario();

    obtenerClima();

    actualizarReloj();

};


/* =========================================================
   AJUSTES
   ========================================================= */

document.getElementById(
    "settingsButton"
).onclick = function() {

    var config =
        obtenerConfiguracion();


    cityInput.value =
        config.city;

    latInput.value =
        config.lat;

    lonInput.value =
        config.lon;


    settingsModal.className =
        "modal active";

};


/* =========================================================
   GUARDAR AJUSTES
   ========================================================= */

document.getElementById(
    "saveButton"
).onclick = function() {

    localStorage.setItem(
        "dashboard_city",
        cityInput.value
    );


    localStorage.setItem(
        "dashboard_lat",
        latInput.value
    );


    localStorage.setItem(
        "dashboard_lon",
        lonInput.value
    );


    city.textContent =
        cityInput.value;


    settingsModal.className =
        "modal";


    obtenerClima();

};


/* =========================================================
   CERRAR MODAL TOCANDO AFUERA
   ========================================================= */

settingsModal.onclick =
    function(event) {

        if (
            event.target ===
            settingsModal
        ) {

            settingsModal.className =
                "modal";

        }

    };


/* =========================================================
   CARGAR CONFIGURACIÓN INICIAL
   ========================================================= */

(function() {

    var config =
        obtenerConfiguracion();


    city.textContent =
        config.city;

})();


/* =========================================================
   MODO AHORRO
   ========================================================= */

/*
   La tablet tiene solo 1 GB RAM.
   Dejamos una clase preparada para
   desactivar animaciones si alguna vez
   queremos priorizar consumo mínimo.
*/

document.body.className =
    "low-power";


</script>
