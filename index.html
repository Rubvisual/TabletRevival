<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>iOS Smart Dashboard</title>

  <!-- PWA & Web App Meta Tags para Pantalla Completa -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#000000">

  <style>
    /* Reset & Tipografía iOS System */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
      color: #ffffff;
      background-color: #000000;
    }

    /* ESTILOS DE FONDOS ESTILO iOS */
    /* 1. iOS Dark Gradient (Default) */
    .bg-ios-dark {
      background: linear-gradient(135deg, #0b0c10 0%, #1a1c23 50%, #0d0e12 100%);
    }

    /* 2. iOS Blur Neón */
    .bg-ios-neon {
      background: linear-gradient(-45deg, #1f0036, #001f3f, #00332a, #2b0018);
      -webkit-animation: gradientAnimation 18s ease infinite;
      animation: gradientAnimation 18s ease infinite;
      background-size: 400% 400%;
    }
    @-webkit-keyframes gradientAnimation {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    @keyframes gradientAnimation {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* 3. iOS Midnight Blue */
    .bg-ios-midnight {
      background: linear-gradient(180deg, #0f2027, #203a43, #2c5364);
    }

    /* 4. OLED Black */
    .bg-ios-oled {
      background: #000000;
    }

    /* WIDGETS CON EFECTO GLASSMORPHISM (CRISTAL TRASLÚCIDO) */
    .ios-card {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      -webkit-backdrop-filter: blur(25px);
      border-radius: 24px;
      padding: 18px 22px;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    }

    /* Layout principal GRID estilo iPad / Dashboard */
    .dashboard-container {
      display: -webkit-box;
      display: -webkit-flex;
      display: flex;
      -webkit-box-orient: vertical;
      -webkit-box-direction: normal;
      -webkit-flex-direction: column;
      flex-direction: column;
      -webkit-box-pack: justify;
      -webkit-justify-content: space-between;
      justify-content: space-between;
      height: 100vh;
      padding: 24px;
      position: relative;
      z-index: 1;
    }

    /* Header: Status Bar superior */
    .status-bar {
      display: -webkit-box;
      display: -webkit-flex;
      display: flex;
      -webkit-box-pack: justify;
      -webkit-justify-content: space-between;
      justify-content: space-between;
      -webkit-box-align: center;
      -webkit-align-items: center;
      align-items: center;
      margin-bottom: 10px;
    }
    .status-badge {
      font-size: 0.8rem;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.7);
      display: -webkit-box;
      display: -webkit-flex;
      display: flex;
      -webkit-box-align: center;
      -webkit-align-items: center;
      align-items: center;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      background-color: #30d158; /* Verde Apple */
      border-radius: 50%;
      margin-right: 6px;
    }

    /* Cuerpo Principal: 2 Columnas (Reloj + Clima a la Izq, Calendario a la Der) */
    .main-content {
      display: -webkit-box;
      display: -webkit-flex;
      display: flex;
      -webkit-box-flex: 1;
      -webkit-flex: 1;
      flex: 1;
      -webkit-box-align: center;
      -webkit-align-items: center;
      align-items: center;
      -webkit-box-pack: justify;
      -webkit-justify-content: space-between;
      justify-content: space-between;
      gap: 20px;
    }

    /* Seccion Izquierda: Reloj y Clima */
    .left-section {
      -webkit-box-flex: 1;
      -webkit-flex: 1;
      flex: 1;
      display: -webkit-box;
      display: -webkit-flex;
      display: flex;
      -webkit-box-orient: vertical;
      -webkit-box-direction: normal;
      -webkit-flex-direction: column;
      flex-direction: column;
      -webkit-box-pack: center;
      -webkit-justify-content: center;
      justify-content: center;
    }

    .clock-time {
      font-size: 7.5rem;
      font-weight: 700;
      letter-spacing: -3px;
      line-height: 0.9;
      color: #ffffff;
      text-shadow: 0 4px 20px rgba(0,0,0,0.4);
    }
    .clock-date {
      font-size: 1.6rem;
      font-weight: 500;
      color: #ff3b30; /* Rojo/Naranja icónico de la app Calendario de Apple */
      margin-top: 12px;
      text-transform: capitalize;
      letter-spacing: -0.5px;
    }

    /* Widget Clima en columna izquierda */
    .weather-widget {
      margin-top: 25px;
      display: -webkit-box;
      display: -webkit-flex;
      display: flex;
      -webkit-box-align: center;
      -webkit-align-items: center;
      align-items: center;
      width: -webkit-fit-content;
      width: fit-content;
    }
    .weather-temp {
      font-size: 2.2rem;
      font-weight: 600;
      margin-right: 14px;
    }
    .weather-details {
      font-size: 0.9rem;
      line-height: 1.3;
      color: rgba(255, 255, 255, 0.85);
    }

    /* Seccion Derecha: Widget Calendario iOS */
    .right-section {
      width: 320px;
    }

    .calendar-widget {
      width: 100%;
    }
    .calendar-header {
      display: -webkit-box;
      display: -webkit-flex;
      display: flex;
      -webkit-box-pack: justify;
      -webkit-justify-content: space-between;
      justify-content: space-between;
      -webkit-box-align: center;
      -webkit-align-items: center;
      align-items: center;
      margin-bottom: 14px;
      font-size: 1.1rem;
      font-weight: 600;
      color: #ffffff;
      text-transform: capitalize;
    }
    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
      text-align: center;
    }
    .cal-day-name {
      font-size: 0.75rem;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.4);
      margin-bottom: 4px;
      text-transform: uppercase;
    }
    .cal-day {
      font-size: 0.95rem;
      font-weight: 400;
      height: 32px;
      width: 32px;
      line-height: 32px;
      margin: 0 auto;
      border-radius: 50%;
      color: rgba(255, 255, 255, 0.9);
    }
    .cal-day.empty {
      background: transparent;
    }
    .cal-day.today {
      background-color: #ff3b30; /* Círculo rojo de iOS en el día actual */
      color: #ffffff;
      font-weight: 700;
      box-shadow: 0 2px 10px rgba(255, 59, 48, 0.5);
    }

    /* Footer y Botones de Control */
    .footer {
      display: -webkit-box;
      display: -webkit-flex;
      display: flex;
      -webkit-box-pack: justify;
      -webkit-justify-content: space-between;
      justify-content: space-between;
      -webkit-box-align: center;
      -webkit-align-items: center;
      align-items: center;
    }
    .quote-box {
      font-size: 0.95rem;
      font-weight: 400;
      color: rgba(255, 255, 255, 0.6);
      max-width: 75%;
    }
    .controls {
      display: -webkit-box;
      display: -webkit-flex;
      display: flex;
      gap: 10px;
    }
    .btn-ios {
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #ffffff;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      font-size: 1.1rem;
      display: -webkit-box;
      display: -webkit-flex;
      display: flex;
      -webkit-box-pack: center;
      -webkit-justify-content: center;
      justify-content: center;
      -webkit-box-align: center;
      -webkit-align-items: center;
      align-items: center;
      cursor: pointer;
    }

    /* Modal de Ajustes Estilo iOS Sheet */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.7);
      z-index: 10;
      -webkit-box-pack: center;
      -webkit-justify-content: center;
      justify-content: center;
      -webkit-box-align: center;
      -webkit-align-items: center;
      align-items: center;
    }
    .modal.active {
      display: -webkit-box;
      display: -webkit-flex;
      display: flex;
    }
    .modal-content {
      background: #1c1c1e; /* Color oscuro oficial de iOS modal */
      border: 1px solid rgba(255, 255, 255, 0.15);
      width: 90%;
      max-width: 420px;
      border-radius: 28px;
      padding: 24px;
    }
    .modal-title {
      font-size: 1.3rem;
      font-weight: 600;
      margin-bottom: 18px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 10px;
    }
    .form-group {
      margin-bottom: 16px;
    }
    .form-group label {
      display: block;
      font-size: 0.85rem;
      margin-bottom: 6px;
      color: rgba(255, 255, 255, 0.6);
    }
    .form-control {
      width: 100%;
      padding: 12px;
      background: #2c2c2e;
      border: 1px solid #3a3a3c;
      color: #fff;
      border-radius: 12px;
      font-size: 0.95rem;
    }
    .btn-save {
      width: 100%;
      padding: 14px;
      background: #0a84ff; /* Azul Apple */
      border: none;
      color: #fff;
      font-weight: 600;
      border-radius: 14px;
      font-size: 1rem;
      margin-top: 10px;
      cursor: pointer;
    }
  </style>
</head>
<body id="body" class="bg-ios-dark">

  <div class="dashboard-container">
    <!-- Top Status Bar -->
    <div class="status-bar">
      <div class="status-badge">
        <div class="status-dot" id="status-dot"></div>
        <span id="status-text">Smart Dashboard iOS</span>
      </div>
      <div class="status-badge" id="city-name">Buenos Aires</div>
    </div>

    <!-- Main Grid: Reloj + Clima (Izq) y Calendario (Der) -->
    <div class="main-content">
      
      <!-- Columna Izquierda -->
      <div class="left-section">
        <div class="clock-time" id="clock">00:00</div>
        <div class="clock-date" id="date">Cargando fecha...</div>

        <!-- Widget Clima -->
        <div class="ios-card weather-widget">
          <div class="weather-temp" id="temp">--°C</div>
          <div class="weather-details">
            <div id="weather-status" style="font-weight: 600;">Cargando...</div>
            <div style="opacity: 0.6; font-size: 0.8rem;" id="weather-sub">Actualizado recién</div>
          </div>
        </div>
      </div>

      <!-- Columna Derecha: Widget Calendario -->
      <div class="right-section">
        <div class="ios-card calendar-widget">
          <div class="calendar-header">
            <span id="cal-month-year">Mes Año</span>
          </div>
          <div class="calendar-grid">
            <!-- Nombres de Días -->
            <div class="cal-day-name">D</div>
            <div class="cal-day-name">L</div>
            <div class="cal-day-name">M</div>
            <div class="cal-day-name">M</div>
            <div class="cal-day-name">J</div>
            <div class="cal-day-name">V</div>
            <div class="cal-day-name">S</div>
          </div>
          <!-- Grilla de días generada dinámicamente -->
          <div class="calendar-grid" id="cal-days-grid" style="margin-top: 6px;"></div>
        </div>
      </div>

    </div>

    <!-- Footer: Frase + Controles -->
    <div class="footer">
      <div class="quote-box" id="quote">"La simplicidad es la máxima sofisticación."</div>
      <div class="controls">
        <button class="btn-ios" id="btn-refresh" title="Recargar">↻</button>
        <button class="btn-ios" id="btn-open-settings" title="Ajustes">⚙</button>
      </div>
    </div>
  </div>

  <!-- Modal Ajustes -->
  <div class="modal" id="modal-settings">
    <div class="modal-content">
      <div class="modal-title">Ajustes del Dashboard</div>
      
      <div class="form-group">
        <label for="bg-select">Estilo Visual (iOS):</label>
        <select id="bg-select" class="form-control">
          <option value="bg-ios-dark">iOS Dark Glass</option>
          <option value="bg-ios-neon">iOS Blur Neón</option>
          <option value="bg-ios-midnight">iOS Midnight Blue</option>
          <option value="bg-ios-oled">OLED Negro Puro</option>
        </select>
      </div>

      <div class="form-group">
        <label for="lat-input">Latitud (Ubicación Clima):</label>
        <input type="text" id="lat-input" class="form-control" value="-34.6037">
      </div>

      <div class="form-group">
        <label for="lon-input">Longitud (Ubicación Clima):</label>
        <input type="text" id="lon-input" class="form-control" value="-58.3816">
      </div>

      <button class="btn-save" id="btn-close-settings">Guardar Cambios</button>
    </div>
  </div>

  <script>
    // JavaScript en ES5 estricto para compatibilidad total con Android 4.4 / Chrome 34

    var body = document.getElementById('body');
    var clockEl = document.getElementById('clock');
    var dateEl = document.getElementById('date');
    var tempEl = document.getElementById('temp');
    var statusEl = document.getElementById('weather-status');
    var quoteEl = document.getElementById('quote');
    
    var modal = document.getElementById('modal-settings');
    var btnOpen = document.getElementById('btn-open-settings');
    var btnClose = document.getElementById('btn-close-settings');
    var btnRefresh = document.getElementById('btn-refresh');
    var bgSelect = document.getElementById('bg-select');
    var latInput = document.getElementById('lat-input');
    var lonInput = document.getElementById('lon-input');

    var calMonthYear = document.getElementById('cal-month-year');
    var calDaysGrid = document.getElementById('cal-days-grid');

    var quotes = [
      '"La simplicidad es la máxima sofisticación."',
      '"Haz que cada día sea tu obra maestra."',
      '"El diseño no es solo cómo se ve, es cómo funciona."',
      '"Modo Dashboard Activo."',
      '"Crea el futuro que deseas ver."'
    ];

    // 1. Reloj y Fecha estilo iOS
    function actualizarReloj() {
      var ahora = new Date();
      var horas = String(ahora.getHours());
      var minutos = String(ahora.getMinutes());
      
      if (horas.length < 2) horas = '0' + horas;
      if (minutos.length < 2) minutos = '0' + minutos;
      
      clockEl.textContent = horas + ':' + minutos;

      var opciones = { weekday: 'long', day: 'numeric', month: 'long' };
      dateEl.textContent = ahora.toLocaleDateString('es-ES', opciones);
    }
    setInterval(actualizarReloj, 1000);
    actualizarReloj();

    // 2. Widget de Calendario interactivo iOS
    function generarCalendario() {
      var ahora = new Date();
      var anio = ahora.getFullYear();
      var mes = ahora.getMonth();
      var diaHoy = ahora.getDate();

      // Nombre del mes y año
      var opcionesMes = { month: 'long', year: 'numeric' };
      calMonthYear.textContent = ahora.toLocaleDateString('es-ES', opcionesMes);

      // Primer día del mes y total de días
      var primerDia = new Date(anio, mes, 1).getDay();
      var totalDias = new Date(anio, mes + 1, 0).getDate();

      calDaysGrid.innerHTML = '';

      // Celdas vacías para alinear el primer día
      for (var i = 0; i < primerDia; i++) {
        var divVacio = document.createElement('div');
        divVacio.className = 'cal-day empty';
        calDaysGrid.appendChild(divVacio);
      }

      // Días del mes
      for (var d = 1; d <= totalDias; d++) {
        var divDia = document.createElement('div');
        divDia.className = 'cal-day';
        divDia.textContent = d;

        if (d === diaHoy) {
          divDia.className += ' today';
        }

        calDaysGrid.appendChild(divDia);
      }
    }
    generarCalendario();

    // 3. Clima Open-Meteo
    function obtenerClima() {
      var lat = localStorage.getItem('ios_dash_lat') || '-34.6037';
      var lon = localStorage.getItem('ios_dash_lon') || '-58.3816';
      
      var url = 'https://api.open-meteo.com/v1/forecast?latitude=' + lat + '&longitude=' + lon + '&current_weather=true';

      var xhr = new XMLHttpRequest();
      xhr.open('GET', url, true);
      xhr.onreadystatechange = function() {
        if (xhr.readyState === 4) {
          if (xhr.status === 200) {
            var res = JSON.parse(xhr.responseText);
            if (res && res.current_weather) {
              tempEl.textContent = Math.round(res.current_weather.temperature) + '°C';
              statusEl.textContent = traducirCodigoClima(res.current_weather.weathercode);
            }
          } else {
            statusEl.textContent = 'Sin conexión';
          }
        }
      };
      xhr.send();
    }

    function traducirCodigoClima(code) {
      if (code === 0) return 'Despejado';
      if (code >= 1 && code <= 3) return 'Parcialmente Nublado';
      if (code >= 45 && code <= 48) return 'Niebla';
      if (code >= 51 && code <= 67) return 'Lluvia Ligera';
      if (code >= 80 && code <= 82) return 'Lluvia Intensa';
      if (code >= 95) return 'Tormenta';
      return 'Nublado';
    }

    obtenerClima();
    setInterval(obtenerClima, 15 * 60 * 1000);

    // 4. Rotador de Frases
    function cambiarFrase() {
      var idx = Math.floor(Math.random() * quotes.length);
      quoteEl.textContent = quotes[idx];
    }
    setInterval(cambiarFrase, 30000);

    // 5. Ajustes y Persistencia
    function cargarConfiguracion() {
      var bgGuardado = localStorage.getItem('ios_dash_bg') || 'bg-ios-dark';
      var latGuardada = localStorage.getItem('ios_dash_lat') || '-34.6037';
      var lonGuardada = localStorage.getItem('ios_dash_lon') || '-58.3816';

      body.className = bgGuardado;
      bgSelect.value = bgGuardado;
      latInput.value = latGuardada;
      lonInput.value = lonGuardada;
    }

    btnOpen.onclick = function() { modal.className = 'modal active'; };

    btnClose.onclick = function() {
      var nuevoBg = bgSelect.value;
      var nuevaLat = latInput.value;
      var nuevaLon = lonInput.value;

      localStorage.setItem('ios_dash_bg', nuevoBg);
      localStorage.setItem('ios_dash_lat', nuevaLat);
      localStorage.setItem('ios_dash_lon', nuevaLon);

      body.className = nuevoBg;
      modal.className = 'modal';

      obtenerClima();
    };

    btnRefresh.onclick = function() {
      obtenerClima();
      generarCalendario();
    };

    cargarConfiguracion();
  </script>
</body>
</html>
